<div class="dialog-text">
  <form (ngSubmit)="save()">
    <div class="row">
      <div class="col-12">
        <h1>{{ 'view.edit.title' | translate }}</h1>
      </div>
      <div class="col-12">
        <mat-form-field appearance="outline">
          <mat-label>{{ 'view.edit.fileTitle' | translate }}</mat-label>
          <input
            matInput
            type="text"
            [ngModelOptions]="{ standalone: true }"
            [(ngModel)]="image.file_name"
          />
        </mat-form-field>
      </div>
      <div class="col-12">
        <mat-form-field>
          <mat-label>{{ 'view.edit.expiresAfter' | translate }}</mat-label>
          <mat-select
            [ngModelOptions]="{ standalone: true }"
            [(ngModel)]="expiresAfter"
          >
            <mat-option
              *ngFor="let option of ExpireOptions"
              [value]="option[1]"
            >
              {{ option[0] | translate }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
    <div class="dialog-buttons">
      <button type="button" mat-flat-button (click)="close()" color="accent">
        {{ 'common.actions.cancel' | translate }}
      </button>
      <button type="submit" mat-raised-button color="primary">
        {{ 'common.actions.save' | translate }}
      </button>
    </div>
  </form>
</div>
