<div class="content-border">
  <my-dropzone *ngIf="canUpload">
    <input type="file" fileInput [formControl]="fileControl" />
    <div class="centered">
      <h1>{{ 'upload.title' | translate }}</h1>
      <p>{{ 'upload.dropHint' | translate }}</p>
    </div>
  </my-dropzone>

  <div class="centered" *ngIf="!canUpload">
    <h1>
      <a routerLink="/user/login">{{ 'upload.loginRequired' | translate }}</a>
    </h1>
    <p>{{ 'upload.permissionRequired' | translate }}</p>
  </div>
</div>
