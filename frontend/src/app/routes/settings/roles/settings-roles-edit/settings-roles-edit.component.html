<ng-container *ngIf="editing">
  <h1>
    {{ 'settings.roles.editTitle' | translate: { name: model.rolenameValue } }}
  </h1>
</ng-container>
<ng-container *ngIf="adding">
  <h1>{{ 'settings.roles.addTitle' | translate }}</h1>
</ng-container>

<form (ngSubmit)="updateRole()">
  <div class="row" *ngIf="adding">
    <div class="col-lg-6 col-12">
      <mat-form-field appearance="outline">
        <mat-label>{{ 'settings.roles.roleName' | translate }}</mat-label>
        <input
          matInput
          type="text"
          [formControl]="model.rolename"
          name="rolename"
          autocorrect="off"
          autocapitalize="none"
          required
        />
        <mat-error *ngIf="model.rolename.errors">
          {{ model.rolenameError | translate }}
        </mat-error>
      </mat-form-field>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-6 col-12">
      <values-picker
        [name]="'settings.roles.permission' | translate"
        [name-multiple]="'settings.roles.permissionsMultiple' | translate"
        [value-mapper]="UIFriendlyPermission"
        [control]="model.permissions"
        [disabled-list]="lockedPermissions"
        [selection-list]="allPermissions"
      ></values-picker>
    </div>
  </div>

  <div class="row">
    <div class="col-12 py-4">
      <button mat-raised-button type="submit" color="primary">
        {{
          (editing ? 'settings.roles.update' : 'settings.roles.add') | translate
        }}
      </button>

      <button
        mat-raised-button
        class="ms-2"
        color="accent"
        type="button"
        (click)="cancel()"
      >
        {{ 'common.actions.cancel' | translate }}
      </button>
    </div>
  </div>
</form>
