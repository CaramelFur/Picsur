<h1>{{ 'settings.systemTitle' | translate }}</h1>

<ng-container *ngFor="let category of preferences | async">
  <h2 *ngIf="category.category !== null">
    {{ category.category | translate }}
  </h2>
  <div class="row">
    <ng-container *ngFor="let pref of category.prefs">
      <pref-option
        class="col-md-6 col-12"
        [pref]="pref"
        [update]="sysPrefService.setPreference.bind(sysPrefService)"
        [name]="getName(pref.key) | translate"
        [helpText]="getHelpText(pref.key) | translate"
        [validator]="getValidator(pref.key)"
      ></pref-option>
    </ng-container>
  </div>
</ng-container>
