<ng-container *ngIf="type === 'string'">
  <div class="y-center">
    <mat-form-field appearance="outline" color="accent">
      <mat-label>{{ name }}</mat-label>
      <input
        matInput
        autocorrect="off"
        autocapitalize="none"
        [placeholder]="'common.empty' | translate"
        [formControl]="formControl"
      />
      <!-- show tooltip on press -->
      <button
        mat-icon-button
        matSuffix
        (click)="tooltip.show()"
        *ngIf="helpText !== ''"
      >
        <mat-icon
          matSuffix
          fontSet="material-icons-outlined"
          #tooltip="matTooltip"
          [matTooltip]="helpText"
          matTooltipPosition="left"
          matTooltipHideDelay="0"
        >
          help_outline
        </mat-icon>
      </button>
      <mat-error *ngIf="formControl.invalid">
        {{ getErrorMessage() }}
      </mat-error>
    </mat-form-field>
  </div>
</ng-container>

<ng-container *ngIf="type === 'number'">
  <div class="y-center">
    <mat-form-field appearance="outline" color="accent">
      <mat-label>{{ name }}</mat-label>
      <input
        matInput
        type="number"
        [placeholder]="'common.empty' | translate"
        [formControl]="formControl"

      <button
        mat-icon-button
        matSuffix
        (click)="tooltip.show()"
        *ngIf="helpText !== ''"

        <mat-icon
          matSuffix
          fontSet="material-icons-outlined"
          #tooltip="matTooltip"
          [matTooltip]="helpText"
          matTooltipPosition="left"
          matTooltipHideDelay="0"
        >

        </mat-icon>
      </button>
      <mat-error *ngIf="formControl.invalid">
        {{ getErrorMessage() }}
      </mat-error>
    </mat-form-field>

</ng-container>

<ng-container *ngIf="type === 'boolean'">
  <div class="y-center">
    <mat-form-field appearance="outline" color="accent">
      <mat-label>{{ name }}</mat-label>
      <mat-select
        [formControl]="formControl"
        [placeholder]="'common.empty' | translate"
      >
        <mat-option [value]="false">{{ 'common.no' | translate }}</mat-option>
        <mat-option [value]="true">{{ 'common.yes' | translate }}</mat-option>
      </mat-select>
      <button
        mat-icon-button
        matSuffix
        (click)="tooltip.show()"
        *ngIf="helpText !== ''"
      >
        <mat-icon
          fontSet="material-icons-outlined"
          #tooltip="matTooltip"
          [matTooltip]="helpText"
          matTooltipPosition="left"
          matTooltipHideDelay="0"
        >
          help_outline
        </mat-icon>
      </button>
      <mat-error *ngIf="formControl.invalid">
        {{ getErrorMessage() }}
      </mat-error>
    </mat-form-field>
  </div>
</ng-container>
